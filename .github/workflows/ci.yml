name: NexusRAG CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # Frontend Verification
  # ==========================================
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ragplatform-ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ragplatform-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

  # ==========================================
  # Backend Verification
  # ==========================================
  backend:
    name: Spring Boot Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ragplatform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Compile with Maven
        run: mvn clean compile --batch-mode

      - name: Run Unit Tests
        run: mvn test -Dtest="*Test,!RagplatformApplicationTests,!DocumentRepositoryIntegrationTest" --batch-mode

      - name: Run Testcontainers Integration Tests
        run: mvn test -Dtest=DocumentRepositoryIntegrationTest --batch-mode
