name: Deploy NexusRAG to Azure

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  AZURE_WEBAPP_NAME: ragplatform-app    # Set to your Azure App Service name
  JAVA_VERSION: '21'

jobs:
  # ==========================================
  # Build and Deploy Spring Boot Backend
  # ==========================================
  build-and-deploy-backend:
    name: Build & Deploy Backend to Azure App Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ragplatform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests --batch-mode

      # Deploys the built JAR to Azure App Service
      # Requires AZURE_WEBAPP_PUBLISH_PROFILE in GitHub Repo Secrets
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ragplatform/target/*.jar
